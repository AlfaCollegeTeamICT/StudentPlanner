{% extends "base.html" %}
{% block title %}Edit Task - {{ project.title }}{% endblock %}
{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow">
                <div class="card-body">
                    <h3 class="card-title mb-4">Edit Task in "{{ project.title }}"</h3>
                    <form method="post">
                        <div class="row">
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="title" class="form-label">Task Title *</label>
                                    <input type="text" class="form-control" id="title" name="title" required 
                                           value="{{ task.title }}" placeholder="Enter task title">
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="category" class="form-label">Category</label>
                                    <select class="form-control" id="category" name="category">
                                        <option value="To Do" {% if task.category == 'To Do' %}selected{% endif %}>To Do</option>
                                        <option value="In Progress" {% if task.category == 'In Progress' %}selected{% endif %}>In Progress</option>
                                        <option value="Done" {% if task.category == 'Done' %}selected{% endif %}>Done</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                        
                        <div class="mb-3">
                            <label for="description" class="form-label">Description</label>
                            <textarea class="form-control" id="description" name="description" rows="3" 
                                      placeholder="Enter task description (optional)">{{ task.description or '' }}</textarea>
                        </div>
                        
                        <div class="row">
                            <div class="col-md-4">
                                <div class="mb-3">
                                    <label for="priority" class="form-label">Priority</label>
                                    <select class="form-control" id="priority" name="priority">
                                        <option value="Low" {% if task.priority == 'Low' %}selected{% endif %}>Low</option>
                                        <option value="Medium" {% if task.priority == 'Medium' %}selected{% endif %}>Medium</option>
                                        <option value="High" {% if task.priority == 'High' %}selected{% endif %}>High</option>
                                    </select>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="mb-3">
                                    <label for="assigned_user_id" class="form-label">Assign to</label>
                                    <select class="form-control" id="assigned_user_id" name="assigned_user_id">
                                        <option value="">Unassigned</option>
                                        {% for user in all_users %}
                                        <option value="{{ user.id }}" {% if task.assigned_user_id == user.id %}selected{% endif %}>{{ user.username }}</option>
                                        {% endfor %}
                                    </select>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="mb-3">
                                    <label for="due_date" class="form-label">Due Date</label>
                                    <input type="date" class="form-control" id="due_date" name="due_date" 
                                           value="{{ task.due_date.strftime('%Y-%m-%d') if task.due_date else '' }}">
                                </div>
                            </div>
                        </div>
                        
                        <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                            <a href="{{ url_for('project_board', project_id=project.id) }}" class="btn btn-secondary me-md-2">Cancel</a>
                            <button type="submit" class="btn btn-primary">Update Task</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
